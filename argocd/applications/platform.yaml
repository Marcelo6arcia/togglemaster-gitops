# =============================================================================
# Application "platform" — SecretStore, ExternalSecrets, Job de bootstrap e
# Ingress do ToggleMaster.
# =============================================================================
# Aplicada pela Application raiz (app-of-apps) criada pelo Terraform.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: togglemaster

  source:
    repoURL: https://github.com/Marcelo6arcia/togglemaster-gitops.git
    targetRevision: main
    path: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
