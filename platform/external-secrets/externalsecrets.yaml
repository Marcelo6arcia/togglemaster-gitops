# =============================================================================
# ExternalSecrets — materializam os Secrets do Kubernetes a partir do
# AWS Secrets Manager, a cada hora ou quando o Argo CD sincroniza.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: auth-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/dev/auth-service/database
        property: DATABASE_URL
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/dev/auth-service/app
        property: MASTER_KEY
---
