# REDIS_URL, AWS_SQS_URL e SERVICE_API_KEY vêm de um único segredo JSON:
# dataFrom.extract copia todas as chaves de uma vez.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: evaluation-service-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: evaluation-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/dev/evaluation-service/app
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analytics-service-secret
