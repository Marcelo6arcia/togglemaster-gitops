        key: togglemaster/dev/analytics-service/app
---
# Usado apenas pelo Job de bootstrap do banco: cadastra o hash da chave de
# serviço na tabela api_keys. A chave em claro nunca sai do Secrets Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: auth-service-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_API_KEY_HASH
      remoteRef:
        key: togglemaster/dev/auth-service/app
        property: SERVICE_API_KEY_HASH
