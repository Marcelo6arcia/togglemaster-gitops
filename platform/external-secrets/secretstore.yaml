# =============================================================================
# SecretStore — ponte entre o AWS Secrets Manager e o namespace togglemaster
# =============================================================================
# Não há bloco `auth`: o External Secrets Operator usa as credenciais do próprio
# pod, que vêm da role IRSA anotada no ServiceAccount `external-secrets`
# (criada em terraform/envs/dev/infra, módulo irsa_external_secrets).
#
# Consequência prática: NENHUMA credencial de banco existe neste repositório.
# O que está versionado é a REFERÊNCIA ao segredo, não o segredo.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
