# =============================================================================
# Esquema dos três bancos, versionado junto com o resto da plataforma.
# Todo comando é idempotente: o Job pode rodar quantas vezes for preciso.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  auth.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id         SERIAL PRIMARY KEY,
        name       VARCHAR(100) NOT NULL,
        -- SHA-256 em hexadecimal: sempre 64 caracteres
        key_hash   VARCHAR(64)  NOT NULL UNIQUE,
        is_active  BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

  # Cadastro da chave de servico do evaluation-service. Fica aqui, e nao numa
  # string `psql -c`, porque o psql so interpola variaveis (-v) na entrada
  # lida de arquivo ou stdin; em -c a string vai crua para o servidor e o
  # :'hash' chega literal, gerando `syntax error at or near ":"`.
  #
  # O UPDATE antes do INSERT cobre a rotacao do hash: sem ele, um hash novo
  # inseriria uma linha nova e a chave antiga continuaria is_active = true,
  # porque `name` nao tem constraint UNIQUE e o ON CONFLICT so casa por
  # key_hash. Chave revogada que segue valida e falha de seguranca.
  service-key.sql: |
    UPDATE api_keys SET is_active = false
     WHERE name = 'evaluation-service-key'
       AND key_hash <> :'hash';

    INSERT INTO api_keys (name, key_hash, is_active)
    VALUES ('evaluation-service-key', :'hash', true)
    ON CONFLICT (key_hash) DO UPDATE SET is_active = true;

  flag.sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id          SERIAL PRIMARY KEY,
        name        VARCHAR(100) UNIQUE NOT NULL,
        description TEXT,
        is_enabled  BOOLEAN NOT NULL DEFAULT false,
        created_at  TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at  TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS set_timestamp ON flags;

    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();

  targeting.sql: |
    CREATE TABLE IF NOT EXISTS targeting_rules (
        id         SERIAL PRIMARY KEY,
        flag_name  VARCHAR(100) UNIQUE NOT NULL,
        is_enabled BOOLEAN NOT NULL DEFAULT true,
        rules      JSONB NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;

    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON targeting_rules
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
