# =============================================================================
# Job de bootstrap dos bancos — hook Sync do Argo CD, wave 0
# =============================================================================
# Substitui os ~120 linhas de `scripts/deploy.sh` da Fase 2, que aplicavam
# migrações e geravam a chave de serviço com uma sequência de curl e kubectl
# rodada à mão.
#
# Aqui o Job:
#   1. cria as tabelas dos três bancos (idempotente);
#   2. cadastra o hash da chave de serviço do evaluation-service na tabela
#      api_keys — a chave em claro fica só no Secrets Manager.
#
# Hook de fase SYNC, e não PreSync. Hooks PreSync rodam numa fase própria, que
# termina inteira antes de qualquer recurso do sync ser aplicado — inclusive
# antes do SecretStore (wave -2) e dos ExternalSecrets (wave -1) que produzem
# os Secrets que este Job consome. Como PreSync, o Job esperava por Secrets que
# ainda nem tinham sido pedidos, e o sync travava sem aplicar nada. Sync-waves
# ordenam recursos DENTRO de uma fase; elas não atravessam fases.
#
# Hooks de fase Sync entram na fila de waves junto com os recursos comuns:
#   SecretStore (-2) -> ExternalSecrets (-1) -> este Job (0) -> Ingress (1)
# O Argo CD tem health check para ExternalSecret, então só avança para a wave 0
# depois que os Secrets existem de fato.
#
# hook-delete-policy=BeforeHookCreation: o Job é recriado a cada sync, evitando
# o erro de campo imutável que aconteceria com um Job comum versionado.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
        app.kubernetes.io/part-of: togglemaster
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # usuário postgres da imagem alpine
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              echo ">>> auth-service"
              psql "$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/auth.sql

              echo ">>> flag-service"
              psql "$FLAG_DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/flag.sql

              echo ">>> targeting-service"
              psql "$TARGETING_DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/targeting.sql

              echo ">>> cadastrando a chave de servico do evaluation-service"
              psql "$AUTH_DATABASE_URL" -v ON_ERROR_STOP=1 \
                -v hash="$SERVICE_API_KEY_HASH" \
                -c "INSERT INTO api_keys (name, key_hash, is_active)
                    VALUES ('evaluation-service-key', :'hash', true)
                    ON CONFLICT (key_hash) DO UPDATE SET is_active = true;"

              echo ">>> bootstrap concluido"
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: FLAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-secret
                  key: DATABASE_URL
            - name: TARGETING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL
            - name: SERVICE_API_KEY_HASH
              valueFrom:
                secretKeyRef:
                  name: auth-service-bootstrap
                  key: SERVICE_API_KEY_HASH
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sql
          configMap:
            name: db-migrations
        - name: tmp
          emptyDir: {}
