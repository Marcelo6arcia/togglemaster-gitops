apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: togglemaster

resources:
- ../../../base/analytics-service

# `labels` com includeSelectors=false: o rótulo é aplicado nos objetos sem
# entrar no selector do Deployment, que é imutável depois de criado.
labels:
- pairs:
    app.kubernetes.io/instance: dev

# ---------------------------------------------------------------------------
# ESTE BLOCO É ESCRITO PELO PIPELINE DE CI.
# O job `update-gitops` roda:
#   kustomize edit set image analytics-service=<ecr>/analytics-service:v1.0.0-<sha>
# e faz commit. O Argo CD vê o commit e sincroniza o cluster.
# Não edite manualmente — o próximo build sobrescreve.
# ---------------------------------------------------------------------------
images:
- name: analytics-service
  newName: 456788081240.dkr.ecr.us-east-1.amazonaws.com/analytics-service
  newTag: v1.0.0-77fc3c0

  # Anota o ServiceAccount com a role IRSA do ambiente dev.
  # O ARN sai de: terraform -chdir=terraform/envs/dev/infra output -json irsa_role_arns
patches:
- patch: |-
    - op: replace
      path: /metadata/annotations/eks.amazonaws.com~1role-arn
      value: arn:aws:iam::456788081240:role/togglemaster-dev-analytics-service
  target:
    kind: ServiceAccount
    name: analytics-service
